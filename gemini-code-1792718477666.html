<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Directory Explorer</title>
<style>
  :root {
    --base-font-size: 14px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    
    /* Light Theme Palette */
    --bg-page: #f8fafc;
    --bg-surface: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.85);
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --folder-color: #3b82f6;
    --file-color: #64748b;
    --badge-bg: #f1f5f9;
    --badge-text: #475569;
    --highlight-bg: #fef08a;
    --highlight-text: #713f12;
    --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  }

  [data-theme="dark"] {
    /* Dark Theme Palette */
    --bg-page: #090d16;
    --bg-surface: #111827;
    --bg-header: rgba(17, 24, 39, 0.85);
    --border: #1f2937;
    --border-hover: #374151;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --folder-color: #60a5fa;
    --file-color: #94a3b8;
    --badge-bg: #1e293b;
    --badge-text: #cbd5e1;
    --highlight-bg: #854d0e;
    --highlight-text: #fef08a;
    --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: var(--base-font-size); }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.5;
    padding-bottom: 60px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Top Control Bar */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background-color: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .title-group h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stats-pill {
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--badge-bg);
    color: var(--badge-text);
    padding: 2px 8px;
    border-radius: 9999px;
    border: 1px solid var(--border);
  }

  .controls-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Search Box */
  .search-wrapper {
    position: relative;
    width: 260px;
  }

  .search-input {
    width: 100%;
    padding: 6px 12px 6px 32px;
    font-size: 0.85rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    fill: var(--text-muted);
    pointer-events: none;
  }

  /* UI Buttons */
  .btn-group {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-surface);
  }

  .btn {
    border: none;
    background: var(--bg-surface);
    color: var(--text-primary);
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .btn:hover {
    background-color: var(--border);
  }

  .btn:not(:last-child) {
    border-right: 1px solid var(--border);
  }

  .btn-icon {
    padding: 6px 10px;
  }

  /* Tree Container */
  main {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .tree-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-md);
  }

  /* Tree List Elements */
  ul.tree-root, ul.tree-sub {
    list-style: none;
    padding-left: 0;
  }

  ul.tree-sub {
    margin-left: 12px;
    padding-left: 14px;
    border-left: 1.5px dashed var(--border);
  }

  li.tree-node {
    margin: 4px 0;
    position: relative;
  }

  /* Collapsible Details/Summary */
  details > summary {
    list-style: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--text-primary);
    transition: background-color 0.15s ease;
    user-select: none;
  }

  details > summary::-webkit-details-marker {
    display: none;
  }

  details > summary:hover {
    background: var(--badge-bg);
  }

  .chevron {
    width: 12px;
    height: 12px;
    fill: var(--text-muted);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  details[open] > summary > .chevron {
    transform: rotate(90deg);
  }

  /* Icons */
  .node-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .folder-icon { fill: var(--folder-color); }
  .file-icon { fill: var(--file-color); }

  .file-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.9em;
  }

  .file-item:hover {
    background: var(--badge-bg);
    color: var(--text-primary);
  }

  .child-counter {
    font-size: 0.7em;
    font-family: var(--font-mono);
    color: var(--text-muted);
    background: var(--badge-bg);
    padding: 1px 6px;
    border-radius: 9999px;
  }

  mark {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* Empty & Drag/Drop State */
  .drop-zone {
    border: 2px dashed var(--border-hover);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    background: var(--bg-surface);
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--badge-bg);
  }

  .drop-zone svg {
    width: 48px;
    height: 48px;
    fill: var(--text-muted);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="title-group">
      <h1>
        <svg class="node-icon folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        Directory Tree
      </h1>
      <span class="stats-pill" id="stats-counter">0 Items</span>
    </div>
  </div>

  <div class="controls-group">
    <!-- Search Bar -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-box" class="search-input" placeholder="Filter files or folders...">
    </div>

    <!-- Tree Actions -->
    <div class="btn-group">
      <button class="btn" id="btn-expand-all" title="Expand All Folders">Expand All</button>
      <button class="btn" id="btn-collapse-all" title="Collapse All Folders">Collapse All</button>
    </div>

    <!-- Font Size Changer -->
    <div class="btn-group">
      <button class="btn btn-icon" id="btn-font-dec" title="Decrease Font Size">A-</button>
      <button class="btn" id="btn-font-reset" title="Reset Font Size">100%</button>
      <button class="btn btn-icon" id="btn-font-inc" title="Increase Font Size">A+</button>
    </div>

    <!-- Dark/Light Mode Toggle -->
    <div class="btn-group">
      <button class="btn btn-icon" id="btn-theme" title="Toggle Light/Dark Theme">
        <svg id="theme-icon" class="node-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>

    <!-- Load Local File -->
    <div class="btn-group">
      <button class="btn" id="btn-upload" title="Upload new file_list.txt">Load List</button>
      <input type="file" id="file-picker" accept=".txt" style="display:none">
    </div>
  </div>
</header>

<main>
  <div id="drop-zone" class="drop-zone" style="display:none;">
    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
    <h3>Drop your <code>file_list.txt</code> or <code>file_list_2.txt</code> here</h3>
    <p style="color:var(--text-muted); font-size:0.85em; margin-top:4px;">Or click the "Load List" button above to choose a file.</p>
  </div>

  <div class="tree-card" id="tree-container"></div>
</main>

<script>
  // State variables
  let currentFontSize = parseInt(localStorage.getItem('fontSize') || '14', 10);
  let rawPaths = [];

  // Theme Management
  const themeBtn = document.getElementById('btn-theme');
  const themeIcon = document.getElementById('theme-icon');
  
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    if (theme === 'light') {
      themeIcon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    } else {
      themeIcon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
    }
  }

  const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    setTheme(isDark ? 'light' : 'dark');
  });

  // Font Size Management
  function updateFontSize(px) {
    currentFontSize = Math.min(Math.max(px, 11), 22);
    document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
    localStorage.setItem('fontSize', currentFontSize);
    document.getElementById('btn-font-reset').textContent = `${Math.round((currentFontSize / 14) * 100)}%`;
  }

  document.getElementById('btn-font-dec').addEventListener('click', () => updateFontSize(currentFontSize - 1));
  document.getElementById('btn-font-inc').addEventListener('click', () => updateFontSize(currentFontSize + 1));
  document.getElementById('btn-font-reset').addEventListener('click', () => updateFontSize(14));
  updateFontSize(currentFontSize);

  // Tree Model Parser
  function buildTreeData(paths) {
    const root = {};
    let totalItems = 0;

    for (const raw of paths) {
      const clean = raw.trim().replace(/^\.\//, '');
      if (!clean) continue;
      totalItems++;
      const segments = clean.split('/');
      let current = root;
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        if (!current[seg]) {
          current[seg] = (i === segments.length - 1 && !raw.endsWith('/')) ? null : {};
        }
        if (current[seg] !== null) {
          current = current[seg];
        }
      }
    }
    return { root, totalItems };
  }

  // Icons Helper
  function getFileIcon(name) {
    if (name.endsWith('.md')) return '<svg class="node-icon file-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>';
    if
