<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrative contributor profile</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#111;color:#ededed;max-width:1000px;margin:40px auto;padding:0 24px}a{color:#77d9ca}h1,h2,h3{line-height:1.25}h2{margin-top:2em}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #555;text-align:left}svg{max-width:100%;height:auto}img{max-width:100%}button,select{font:inherit;padding:8px;background:#252525;color:#eee;border:1px solid #666;border-radius:6px}input[type=range]{width:100%;accent-color:#59bfb1}label{display:block;margin:18px 0}.panel{border:1px solid #444;padding:24px;border-radius:12px;margin:24px 0}small,.note{color:#bdbdbd}.value{font-size:28px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}progress{width:100%;accent-color:#59bfb1}pre{white-space:pre-wrap}blockquote{border-left:3px solid #59bfb1;padding-left:18px}</style><body><h1>Illustrative contributor profile</h1><select id="profile" aria-label="Contributor profile"><option>SOVRAEGE mentor</option><option>SYNCZ designer</option><option>SOVRAEGENT</option></select><div class="grid panel"><svg id="radar" viewBox="0 0 260 260" aria-label="Contributor profile radar"></svg><div id="metrics"></div></div><p>Interactive prototype using hypothetical scores. In production, normalize indicators only within suitable reference groups and display evidence confidence and cohort coverage.</p><script>const profiles={"SYNCZ designer": [82, 76, 68, 88, 72, 81], "SOVRAEGENT": [72, 79, 64, 94, 70, 77], "SOVRAEGE mentor": [78, 92, 85, 74, 96, 86]};const labels=['Durable impact','Mastery support','Transfer','Efficiency','Autonomy','Evidence quality'];const s=document.getElementById('profile');function points(v){return v.map((n,i)=>{let a=i*Math.PI/3-Math.PI/2;return [130+Math.cos(a)*n,130+Math.sin(a)*n].join(',')}).join(' ')}function update(){const v=profiles[s.value];let svg='';for(let n of [25,50,75,100])svg+=`<polygon points="${points(Array(6).fill(n))}" fill="none" stroke="#555"/>`;svg+=`<polygon points="${points(v)}" fill="#59bfb133" stroke="#59bfb1" stroke-width="3"/>`;document.getElementById('radar').innerHTML=svg;document.getElementById('metrics').innerHTML=labels.map((l,i)=>`<label>${l} <b>${v[i]}</b><progress value="${v[i]}" max="100"></progress></label>`).join('')}s.addEventListener('change',update);update();</script></body></html>
